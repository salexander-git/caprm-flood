project:
  name: CAPRM-Flood
  study_region: Monroe County, New York
  project_crs: EPSG:3857
  distance_crs: EPSG:26918

property_points:
  source_name: NYS Tax Parcel Centroid Points
  source_url: https://gisservices.its.ny.gov/arcgis/rest/services/NYS_Tax_Parcel_Centroid_Points/FeatureServer/0/query
  county_field: COUNTY_NAME
  county_value: Monroe
  id_field_candidates:
    - SBL
    - PRINT_KEY
    - OBJECTID
  canonical_id_field: SBL
  object_id_batch_size: 500
  sample_limit: 267362
  output_path: data/processed/monroe_property_points_countywide.geojson

fema_flood_polygons:
  source_name: FEMA NFHL
  manual_input_path: data/raw/fema_nfhl_monroe/S_FLD_HAZ_AR.shp
  processed_output_path: data/processed/fema_flood_polygons_monroe.geojson
  zone_field_candidates:
    - FLD_ZONE
    - ZONE_SUBTY
  sfha_field_candidates:
    - SFHA_TF
  id_field_candidates:
    - FLD_AR_ID
    - DFIRM_ID
    - OBJECTID

study_area:
  source_name: U.S. Census Bureau TIGERweb Counties
  service_url: https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer
  layer_id: 1
  county_geoid: "36055"
  county_name: Monroe County, New York
  source_vintage: January 1, 2025
  cache_crs: EPSG:4326
  cache_path: data/raw/census_monroe_county_2025.geojson

hydrography:
  source_name: USGS 3D Hydrography Program
  service_url: https://hydro.nationalmap.gov/arcgis/rest/services/3DHP_all/MapServer
  query_crs: EPSG:26918
  cache_crs: EPSG:4326
  query_buffer_meters: 20000
  cache_path: data/raw/usgs_3dhp_monroe.gpkg
  manifest_path: outputs/validation/hydrography_cache_manifest.json

  flowline:
    layer_id: 50
    included_feature_types:
      - 1
      - 2
      - 3

  waterbody:
    layer_id: 60
    included_feature_types:
      - 1
      - 2
      - 3
      - 4

outputs:
  python_baseline_csv: outputs/baseline/python_fema_membership_countywide.csv
  python_nearest_water_csv: outputs/baseline/python_nearest_water_countywide.csv
  python_nearest_water_summary: outputs/validation/python_nearest_water_countywide_summary.json
  integrated_property_evidence_csv: outputs/evidence/property_flood_evidence_countywide.csv
  integrated_property_evidence_manifest: outputs/validation/property_flood_evidence_countywide_manifest.json